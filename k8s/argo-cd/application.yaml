apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: game-service
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/LazarGrbic11/nordeus-sre-challenge-enhanced.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: game-service

  syncPolicy:
    automated:
      prune: true
      selfHeal: true