apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-service
  namespace: game-service
  labels:
    app: game-service
spec:
  serviceAccountName: ksa
   nodeSelector:
      iam.gke.io/gke-metadata-server-enabled: "true"
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: game-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: game-service
    spec:
      containers:
        - name: game-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}