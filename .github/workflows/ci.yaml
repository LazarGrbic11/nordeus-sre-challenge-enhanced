name: Build and Push

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  BASE_NUMBER: 2

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker
        run: |
          gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push
        run: |
          IMAGE_URI="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GCP_IMAGE_REPO }}/${{ secrets.GCP_IMAGE_NAME }}:1.0.${{ github.sha }}"

          docker build \
            --platform linux/amd64 \
            -t "$IMAGE_URI" \
            .

          docker push "$IMAGE_URI"