name: Build and Push

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  IMAGE_URI: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_IMAGE_REPO }}/${{ vars.GCP_IMAGE_NAME }}
  TAG: 1.0.${GITHUB_SHA::7}

jobs:
  BuildGameService:
    name: Build Python game
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd game-service
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start game service in background
        run: |
          cd game-service
          nohup python3 main.py > game-service.log 2>&1 &
          sleep 5
          curl -fsS http://127.0.0.1:8000/health

  PushToGCP:
    name: Push to GCP
    needs: BuildGameService
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-iam/providers/github
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker
        run: |
          gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Generate image tag
        run: echo "tag=1.0.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        run: |
          cd game-service
          docker build \
            --platform linux/amd64 \
            -t "${{env.IMAGE_URI}}:${{env.TAG}}" \
            .

          docker push "${{env.IMAGE_URI}}:${{env.TAG}}"

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.GCP_CLUSTER }}
          location: ${{ vars.GCP_REGION }}

      - name: Update Helm chart values
        run: |
          sed -i 's/^  tag: .*/  tag: "'"${GITHUB_SHA::7}"'"/' \
          k8s/helm/game-service/values.yaml

          cat k8s/helm/game-service/values.yaml
          helm lint k8s/helm/game-service

      - name: Deploy
        run: |
          if ! kubectl get namespace game-service; then
            kubectl apply -f k8s/namespace/namespace.yaml
          fi

          helm upgrade --install game-service \
          ./k8s/helm/game-service \
          --namespace game-service \
          --set image.tag=${{ env.TAG }}